services:
  - type: web
    name: fortyfives-web
    runtime: python
    plan: free
    branch: claude/mobile-web-development-DkFI3
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
