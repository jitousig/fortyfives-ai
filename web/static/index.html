<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b5e20">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fortyfives">
  <title>Fortyfives</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <div id="app">

    <!-- ── Main table ── -->
    <div id="table-area">

      <!-- North -->
      <div id="north-zone" class="player-zone">
        <div id="north-label" class="player-label">North <span class="partner-tag">Partner</span></div>
        <div id="bid-chip-2" class="bid-chip"></div>
        <div id="north-hand" class="hand-area"></div>
      </div>

      <!-- Middle row: West | Trick | East -->
      <div id="middle-row">
        <div id="west-zone" class="player-zone side-zone">
          <div id="west-label" class="player-label">West</div>
          <div id="bid-chip-1" class="bid-chip"></div>
          <div id="west-hand" class="hand-area vertical"></div>
        </div>

        <div id="trick-area">
          <div id="trick-north" class="trick-slot"></div>
          <div id="trick-mid-row">
            <div id="trick-west" class="trick-slot"></div>
            <div id="trick-center">
              <div id="trump-badge"></div>
              <div id="trick-num"></div>
            </div>
            <div id="trick-east" class="trick-slot"></div>
          </div>
          <div id="trick-south" class="trick-slot"></div>
        </div>

        <div id="east-zone" class="player-zone side-zone">
          <div id="east-label" class="player-label">East</div>
          <div id="bid-chip-3" class="bid-chip"></div>
          <div id="east-hand" class="hand-area vertical"></div>
        </div>
      </div>

      <!-- South (human) -->
      <div id="south-zone" class="player-zone">
        <div id="south-hand" class="hand-area human-hand"></div>
        <div id="south-label" class="player-label">You <span id="dealer-tag" class="dealer-tag" style="display:none">Dealer</span></div>
        <div id="bid-chip-0" class="bid-chip"></div>
        <div id="action-area"></div>
      </div>

    </div>

    <!-- ── Right panel ── -->
    <div id="right-panel">
      <div id="rp-header">
        <span class="game-title">Fortyfives</span>
        <span id="conn-status" class="conn-dot disconnected" title="Connection status"></span>
      </div>

      <div id="score-card">
        <div class="score-row highlight">
          <span>N/S &nbsp;<small>(You &amp; North)</small></span>
          <span id="score-ns" class="score-val">0</span>
        </div>
        <div class="score-row">
          <span>E/W &nbsp;<small>(West &amp; East)</small></span>
          <span id="score-ew" class="score-val">0</span>
        </div>
        <div class="score-target">First to 125 wins</div>
      </div>

      <div id="status-block">
        <div id="phase-label"></div>
        <div id="turn-display"></div>
        <div id="bid-block"></div>
        <div id="tricks-block"></div>
      </div>

      <div id="log-wrap">
        <div class="log-title">Game Log</div>
        <div id="game-log"></div>
      </div>

      <button id="new-game-btn" onclick="newGame()">New Game</button>
    </div>

  </div>

  <!-- Mobile log/info drawer -->
  <button id="drawer-toggle" onclick="toggleDrawer()" aria-label="Open game log">&#9776;<span>Log</span></button>
  <div id="drawer-backdrop" onclick="closeDrawer()"></div>
  <aside id="drawer">
    <div id="drawer-handle" onclick="closeDrawer()"></div>
    <div id="drawer-title">Game Log</div>
    <div id="drawer-body"></div>
  </aside>

  <!-- Hand-summary overlay (between hands) -->
  <div id="hand-overlay">
    <div id="hand-overlay-box">
      <div id="hand-overlay-title">Hand Complete</div>
      <div id="hand-overlay-msg"></div>
      <button onclick="continueHand()">Next Hand</button>
    </div>
  </div>

  <!-- Game-over overlay -->
  <div id="overlay">
    <div id="overlay-box">
      <div id="overlay-title">Game Over</div>
      <div id="overlay-msg"></div>
      <button onclick="newGame()">Play Again</button>
    </div>
  </div>

  <!-- PWA install affordance (hidden until installable / iOS Safari) -->
  <div id="install-bar" hidden>
    <span id="install-text"></span>
    <button id="install-btn" type="button" hidden>Install</button>
    <button id="install-dismiss" type="button" aria-label="Dismiss">&times;</button>
  </div>

  <script src="/static/game.js?v=3"></script>
</body>
</html>
